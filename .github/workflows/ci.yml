name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Validate each mobile stack layer before its dependency lands on main.
    branches: [main, 'codex/mobile-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PROJECT: Annex/Annex.xcodeproj
  SCHEME: ClubhouseGo

# changes ─┬─ swift-packages                       (fast lane: swift test, coverage ratchet)
#          ├─ build ── ui-tests × N shards          (build once, test-without-building)
#          └─ release-build                         (parallel; not on the critical path)
# ci-result gathers them into one check.
#
# Pull requests run only the lanes their files need (scripts/ci/changes.py); pushes to main run everything.
# UI shards come from scripts/ci/ui_shards.py.
jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.plan.outputs.swift }}
      app: ${{ steps.plan.outputs.app }}
      ui-shards: ${{ steps.plan.outputs.ui-shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Test CI scripts
        run: python3 -m unittest discover -s scripts/ci/tests

      - name: Choose lanes and UI shards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed-files.txt
            echo "Changed files:"; cat changed-files.txt
            python3 scripts/ci/changes.py < changed-files.txt | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi
          python3 scripts/ci/ui_shards.py >> "$GITHUB_OUTPUT"

  swift-packages:
    name: Swift packages
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # PinnedIOTests starts a Node TLS fixture through /usr/bin/env.
      - name: Set up Node for transport TLS tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Report transport TLS test runtime
        run: node --version

      - id: xcode
        uses: ./.github/actions/setup-xcode

      # Keeps the compiled, coverage-instrumented dependencies (swift-markdown, opentelemetry); a fresh
      # checkout's sources are newer than the cache, so this package's own modules always rebuild.
      # Coverage data is excluded so the ratchet only ever reads this run's profile.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            !.build/coverage
            !.build/*/*/codecov
          key: swiftpm-build-cov-${{ runner.os }}-${{ steps.xcode.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Test transport package
        run: swift test --enable-code-coverage

      # Same run as above; fails only if a target drops below coverage-baseline.json.
      - name: Check coverage ratchet
        run: scripts/coverage.sh --skip-tests --check

      - name: Test bundled Framebriar package
        run: swift test --package-path Vendor/Framebriar

  build:
    name: Build for testing
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      xcode: ${{ steps.xcode.outputs.xcode }}
    steps:
      - uses: actions/checkout@v4

      - id: xcode
        uses: ./.github/actions/setup-xcode

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: xcode-spm-${{ hashFiles('Package.resolved', 'Annex/Annex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # No simulator needed: build for the generic simulator, Apple-silicon only, like the runners.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_MIGRATION_CHECK=YES \
            -quiet

      # tar keeps the bundles' symlinks and executable bits, which an artifact zip drops.
      - name: Package test products
        run: tar -C DerivedData/Build -cf - Products | zstd -T0 -3 -q -o test-products.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: test-products
          path: test-products.tar.zst
          compression-level: 0
          retention-days: 1

  release-build:
    name: Release build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-xcode

      - name: Restore Swift package checkouts
        uses: actions/cache/restore@v4
        with:
          path: SourcePackages
          key: xcode-spm-${{ hashFiles('Package.resolved', 'Annex/Annex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build Release
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData-Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_MIGRATION_CHECK=YES \
            -quiet

  ui-tests:
    name: ${{ matrix.name }}
    needs: [changes, build]
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ui-shards) }}
    steps:
      - uses: actions/checkout@v4

      # Fetch and unpack before booting: on these 3-core runners a booting simulator
      # slowed both steps from seconds to over a minute each.
      - uses: actions/download-artifact@v4
        with:
          name: test-products

      - name: Unpack test products
        run: |
          mkdir -p DerivedData/Build
          zstd -dc test-products.tar.zst | tar -C DerivedData/Build -xf -
          XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun)
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"
          echo "Test plan: $XCTESTRUN"

      - uses: ./.github/actions/setup-xcode
        with:
          xcode: ${{ needs.build.outputs.xcode }}
          boot-simulator: 'true'

      - name: Wait for simulator boot
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # Hosted simulator launches/termination exceeded the old 60-second rounded
      # allowance. Keep assertions intact while allowing a bounded two minutes.
      # Hosted macOS runners can take 15–20 s per element lookup and occasionally drop a tap.
      # A UI test that fails is retried up to twice; the result only passes if a retry passes,
      # and verify-xcresult.py flags every test that needed a retry. One shard also runs the
      # ClubhouseGoTests bundle here (saving a second 2–3 minute test launch); those must pass first time.
      # xcodebuild sometimes exits 65 even when all tests pass (known Xcode bug).
      # Verify the complete result bundle, not an individual passing suite in the log.
      - name: Run tests
        run: |
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DEST" \
            ${{ matrix.selection }} \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults/UITests.xcresult \
            2>&1 | tee xcodebuild-ui.log || true

          python3 scripts/verify-xcresult.py TestResults/UITests.xcresult "${{ matrix.name }}" \
            ${{ matrix.unit && '--no-retries-in ClubhouseGoTests' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: |
            TestResults
            xcodebuild-*.log
          retention-days: 7

  # One check that is green when every lane this change needs passed (skipped lanes are fine).
  ci-result:
    name: CI result
    needs: [changes, swift-packages, build, release-build, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          bad = {job: n['result'] for job, n in json.load(sys.stdin).items() if n['result'] not in ('success', 'skipped')}
          print('Lanes:', 'all passed or not needed' if not bad else bad)
          sys.exit(1 if bad else 0)
          "
