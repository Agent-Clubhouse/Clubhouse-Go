name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Validate each mobile stack layer before its dependency lands on main.
    branches: [main, 'codex/mobile-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Annex/Annex.xcodeproj
  SCHEME: ClubhouseGo

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    # The UI suite grew to ~12 preview tests (~18 min on hosted runners, plus retries).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode matching simulator runtime
        run: |
          # Find the installed iOS simulator runtime version
          SIM_VER=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in sorted(data['runtimes'], key=lambda x: x.get('version',''), reverse=True):
              if 'iOS' in r.get('name','') and r.get('isAvailable', False):
                  print(r['version'])
                  sys.exit(0)
          sys.exit(1)
          ")
          echo "Simulator runtime: iOS $SIM_VER"

          # Pick the Xcode whose SDK best matches the simulator runtime
          BEST_XCODE=""
          for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            SDK_VER=$("$xc/Contents/Developer/usr/bin/xcodebuild" -version -sdk iphonesimulator ProductVersion 2>/dev/null || true)
            echo "  $xc → SDK $SDK_VER"
            if [ "$SDK_VER" = "$SIM_VER" ]; then
              BEST_XCODE="$xc"
              break
            fi
          done

          # Fall back to latest if no exact match
          if [ -z "$BEST_XCODE" ]; then
            BEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "No exact SDK match — falling back to latest: $BEST_XCODE"
          fi

          echo "Selected Xcode: $BEST_XCODE"
          sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Resolve simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in data['devices'][runtime]:
                  if 'iPhone' in d['name']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "DEST=platform=iOS Simulator,name=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "Using simulator: $DEVICE_NAME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_MIGRATION_CHECK=YES \
            -quiet

      - name: Build Release
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData-Release \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_MIGRATION_CHECK=YES \
            -quiet

      - name: Test transport package
        run: swift test

      - name: Test bundled Framebriar package
        run: swift test --package-path Vendor/Framebriar

      # xcodebuild sometimes exits 65 even when all tests pass (known Xcode bug).
      # Verify the complete result bundle, not an individual passing suite in the log.
      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            -only-testing:ClubhouseGoTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults/UnitTests.xcresult \
            2>&1 | tee xcodebuild-unit.log || true

          python3 scripts/verify-xcresult.py TestResults/UnitTests.xcresult

      # Hosted simulator launches/termination exceeded the old 60-second rounded
      # allowance. Keep assertions intact while allowing a bounded two minutes.
      # Hosted macOS runners can take 15–20 s per element lookup and occasionally drop a tap.
      # A UI test that fails is retried up to twice; the result only passes if a retry passes.
      - name: Run UI tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            -only-testing:ClubhouseGoUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults/UITests.xcresult \
            2>&1 | tee xcodebuild-ui.log || true

          python3 scripts/verify-xcresult.py TestResults/UITests.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            xcodebuild-*.log
          retention-days: 7
