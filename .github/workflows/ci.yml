name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Validate each mobile stack layer before its dependency lands on main.
    branches: [main, 'codex/mobile-*']
  # The coalesced daily run takes every lane, a fast UI core and one rotating slice of the extended UI inventory
  # (scripts/ci/ui_tiers.py: every UI test at least weekly). Pull requests and pushes to main run a small pre-merge
  # scope (scripts/ci/ui_scope.py); a `ci:full` label (then push or re-run) or a manual run takes every UI test.
  schedule:
    - cron: '23 10 * * *' # 10:23 UTC daily
  workflow_dispatch:

concurrency:
  # The scheduled run has its own group: a push never replaces a queued daily slice, nor the reverse.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  # Each merge to main used to cancel main's run, so none finished. Let the run in progress finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

env:
  PROJECT: Annex/Annex.xcodeproj
  SCHEME: ClubhouseGo

# changes ─┬─ swift-packages                       (fast lane: vendor check, swift test, coverage ratchet)
#          ├─ build ── ui-tests × N shards + iPad   (build once, test-without-building)
#          └─ release-build                         (parallel; not on the critical path)
# ci-result gathers them into one check.
#
# Pull requests and pushes to main run only the lanes their files need (scripts/ci/changes.py) and a small pre-merge
# UI scope (scripts/ci/ui_scope.py): a fixed native smoke, the classes they edit and the critical journeys of the areas
# they touch, with a broader tier for hubs and unknown files. The daily run takes every lane with the fast UI core and
# today's extended slice (scripts/ci/ui_tiers.py); a manual run and the `ci:full` label run every lane and UI class
# from scripts/ci/ui_shards.py.
jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.plan.outputs.swift }}
      app: ${{ steps.plan.outputs.app }}
      ui-shards: ${{ steps.plan.outputs.ui-shards }}
      ui: ${{ steps.plan.outputs.ui }}
      ipad: ${{ steps.plan.outputs.ipad }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # Two commits: a pull request's merge commit and its base, or a push and its parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Test CI scripts
        run: python3 -m unittest discover -s scripts/ci/tests

      - name: Choose lanes and UI shards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSHED_COMMITS: ${{ github.event_name == 'push' && toJSON(github.event.commits) || '[]' }}
        run: |
          set -euo pipefail
          SELECT=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Read the labels now (read-only), not from the event payload: after adding `ci:full`, push a commit or
            # re-run this workflow and it takes every lane. Adding a label alone starts no run; there is no `labeled`
            # trigger, so other labels never start or replace one.
            # A failed lookup fails the plan rather than silently narrowing.
            LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')
            if printf '%s\n' "$LABELS" | grep -qx 'ci:full'; then
              echo "ci:full label: every lane"
            else
              SELECT=true
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$(echo "$PUSHED_COMMITS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 1 ]; then
            SELECT=true  # one pushed commit (a squash merge) and its parent; anything else runs everything
          fi
          if [ "$SELECT" = true ]; then
            # Statuses, renames and line hunks come from one immutable local diff: the PR's merge commit against its
            # base parent, or the pushed commit against its parent. No paginated or racing API file list.
            git diff --name-status -M HEAD^1 HEAD > changed-files.txt
            git diff -U0 -M HEAD^1 HEAD > changes.diff
            echo "Changed files:"; cat changed-files.txt
            cut -f2- changed-files.txt | tr '\t' '\n' | python3 scripts/ci/changes.py | tee -a "$GITHUB_OUTPUT"
            python3 scripts/ci/ui_shards.py \
              | python3 scripts/ci/ui_scope.py changed-files.txt --diff changes.diff --manifest impact-manifest.json \
              | tee -a "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python3 scripts/ci/changes.py --all | tee -a "$GITHUB_OUTPUT"
            python3 scripts/ci/ui_shards.py \
              | python3 scripts/ci/ui_tiers.py --manifest impact-manifest.json \
              | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/changes.py --all | tee -a "$GITHUB_OUTPUT"
            python3 scripts/ci/ui_shards.py >> "$GITHUB_OUTPUT"
            printf 'ui=true\nipad=true\nrelease=true\nunit=true\n' >> "$GITHUB_OUTPUT"
            echo '{"decision": {"full": true, "reason": "manual, ci:full or multi-commit push"}}' > impact-manifest.json
          fi
          # Lanes the selection doesn't need report as skipped; the CI result accepts success or skipped.

      # The selection record, for replaying or auditing exactly what this run chose.
      - uses: actions/upload-artifact@v4
        with:
          name: impact-manifest
          path: impact-manifest.json
          retention-days: 14

  swift-packages:
    name: Swift packages
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Seconds, so first: Vendor/Framebriar must be framebriar's adapters/swift, unchanged.
      - name: Verify vendored Framebriar against SOURCE.json
        run: scripts/verify-framebriar-vendor.sh

      # PinnedIOTests starts a Node TLS fixture through /usr/bin/env.
      - name: Set up Node for transport TLS tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Report transport TLS test runtime
        run: node --version

      - id: xcode
        uses: ./.github/actions/setup-xcode

      # Keeps the compiled, coverage-instrumented dependencies (swift-markdown, opentelemetry); a fresh
      # checkout's sources are newer than the cache, so this package's own modules always rebuild.
      # Coverage data is excluded so the ratchet only ever reads this run's profile.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            !.build/coverage
            !.build/*/*/codecov
          key: swiftpm-build-cov-${{ runner.os }}-${{ steps.xcode.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Report Swift test toolchain
        shell: bash {0}
        run: |
          set -euo pipefail
          {
            swift --version
            xcodebuild -version
            sw_vers
          } 2>&1 | tee swift-test-toolchain.log

      - name: Test transport package
        shell: bash {0}
        run: |
          set -euo pipefail
          set +e
          swift test --enable-code-coverage --xunit-output swift-package-results.xml 2>&1 | tee swift-package-tests.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          # Preserve the test's own failure if the receipt writer also fails.
          if [ "${statuses[0]}" -ne 0 ]; then
            exit "${statuses[0]}"
          fi
          exit "${statuses[1]}"

      # Same run as above; fails only if a target drops below coverage-baseline.json.
      - name: Check coverage ratchet
        run: scripts/coverage.sh --skip-tests --check

      # These availability-gated tests must run on macOS 26, with a constrained cooperative pool.
      # The intentional icon hold has a private thread source; it must not starve that pool.
      - name: Verify icon holds on a constrained cooperative pool
        shell: bash {0}
        run: |
          set -euo pipefail
          BIN_PATH=$(env -u COPILOT_CONNECTION_TOKEN GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all swift build -c debug -j 2 --show-bin-path)
          python3 scripts/ci/run_icon_hold_probe.py "$BIN_PATH" 2>&1 | tee icon-hold-tests.log
          python3 scripts/ci/check_icon_hold_execution.py icon-hold-tests.log

      - name: Test bundled Framebriar package
        run: swift test --package-path Vendor/Framebriar

      - name: Upload original package test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-package-test-receipts
          path: |
            swift-test-toolchain.log
            swift-package-tests.log
            swift-package-results*.xml
          retention-days: 7

  build:
    name: Build for testing
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      xcode: ${{ steps.xcode.outputs.xcode }}
    steps:
      - uses: actions/checkout@v4

      - id: xcode
        uses: ./.github/actions/setup-xcode

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: xcode-spm-${{ hashFiles('Package.resolved', 'Annex/Annex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # No simulator needed: build for the generic simulator, Apple-silicon only, like the runners.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_MIGRATION_CHECK=YES \
            -quiet

      - name: Check reviewed deinit field-affinity policy
        run: |
          python3 -m unittest discover -s scripts/deinit/tests
          python3 scripts/check-isolated-deinits.py DerivedData/Build/Products/Debug-iphonesimulator/ClubhouseGo.app/ClubhouseGo.debug.dylib

      # tar keeps the bundles' symlinks and executable bits, which an artifact zip drops.
      - name: Package test products
        run: tar -C DerivedData/Build -cf - Products | zstd -T0 -3 -q -o test-products.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: test-products
          path: test-products.tar.zst
          compression-level: 0
          retention-days: 1

  release-build:
    name: Release build
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-xcode

      - name: Restore Swift package checkouts
        uses: actions/cache/restore@v4
        with:
          path: SourcePackages
          key: xcode-spm-${{ hashFiles('Package.resolved', 'Annex/Annex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build Release
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Release \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_SKIP_MIGRATION_CHECK=YES \
            -quiet

  ui-tests:
    name: ${{ matrix.name }}
    needs: [changes, build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-26
    # Eight lanes balance whole UI classes within the existing job budget.
    # Keep per-test hang deadlines and retry reporting unchanged; see ui_shards.py.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ui-shards) }}
    steps:
      - uses: actions/checkout@v4

      # Fetch and unpack before booting: on these 3-core runners a booting simulator
      # slowed both steps from seconds to over a minute each.
      - uses: actions/download-artifact@v4
        with:
          name: test-products

      - name: Unpack test products
        run: |
          mkdir -p DerivedData/Build
          zstd -dc test-products.tar.zst | tar -C DerivedData/Build -xf -
          XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun)
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"
          echo "Test plan: $XCTESTRUN"

      - uses: ./.github/actions/setup-xcode
        with:
          xcode: ${{ needs.build.outputs.xcode }}
          boot-simulator: 'true'

      - name: Wait for simulator boot
        timeout-minutes: 5
        run: python3 scripts/ci/wait_simulator.py "$SIMULATOR_UDID"

      - name: Skip first-use keyboard education on the test simulator
        run: xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES

      # Hosted simulator launches/termination exceeded the old 60-second rounded
      # allowance. Keep assertions intact while allowing a bounded two minutes.
      # Hosted macOS runners can take 15–20 s per element lookup and occasionally drop a tap.
      # A UI test that fails is retried up to twice; the result only passes if a retry passes,
      # and verify-xcresult.py flags every test that needed a retry. One shard also runs the
      # ClubhouseGoTests bundle here (saving a second 2–3 minute test launch); those must pass first time.
      # xcodebuild sometimes exits 65 even when all tests pass (known Xcode bug).
      # Verify the complete result bundle, not an individual passing suite in the log.
      - name: Run tests
        run: |
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "$DEST" \
            ${{ matrix.selection }} \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults/UITests.xcresult \
            2>&1 | tee xcodebuild-ui.log || true

          python3 scripts/verify-xcresult.py TestResults/UITests.xcresult "${{ matrix.name }}" \
            ${{ matrix.unit && '--no-retries-in ClubhouseGoTests' || '' }}
          # Every planned class must have run, so a narrowed shard can't pass on an empty or partial selection.
          xcrun xcresulttool get test-results tests --path TestResults/UITests.xcresult > TestResults/tests.json
          python3 scripts/ci/verify_selection.py "${{ matrix.selection }}" TestResults/tests.json

      # Opt-in preview diagnostics contain closed reasons and numeric geometry only.
      # Preserve them even when a UI assertion fails; the app runs in a separate process.
      - name: Collect preview follow diagnostics
        if: ${{ failure() && env.SIMULATOR_UDID != '' }}
        continue-on-error: true
        run: |
          mkdir -p TestResults
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 1h --style compact \
            --predicate 'eventMessage BEGINSWITH "CHAT_FOLLOW " OR eventMessage BEGINSWITH "CHAT_PHASE " OR eventMessage BEGINSWITH "CHAT_UP "' \
            > TestResults/chat-follow.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: |
            TestResults
            xcodebuild-*.log
          retention-days: 7

      # Observation cannot prevent tests/results from running. No OS guard or test-framework task locals.
      - name: Observe installed runtime isolated-deinit control
        if: ${{ matrix.unit && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 6
        run: scripts/probe-isolated-deinit-runtime.sh "$SIMULATOR_UDID"

      - name: Upload runtime observation
        if: ${{ always() && matrix.unit }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: isolated-deinit-runtime
          path: |
            build/isolated-deinit-runtime/*.log
            build/isolated-deinit-runtime/summary.json
          retention-days: 7

  ipad-tests:
    name: iPad hosted tests + UI smoke
    needs: [changes, build]
    if: needs.changes.outputs.ipad == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-products

      - name: Unpack test products
        run: |
          mkdir -p DerivedData/Build
          zstd -dc test-products.tar.zst | tar -C DerivedData/Build -xf -
          echo "XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-xcode
        with:
          xcode: ${{ needs.build.outputs.xcode }}

      - name: Create iPad simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name'] and r.get('isAvailable')]
          print(max(runtimes, key=lambda r: tuple(map(int, r['version'].split('.'))))['identifier'])
          ")
          SIMULATOR_UDID=$(xcrun simctl create "CI iPad" com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB "$RUNTIME")
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "DEST=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"

      - name: Wait for simulator boot
        timeout-minutes: 5
        run: python3 scripts/ci/wait_simulator.py "$SIMULATOR_UDID"

      - name: Skip first-use keyboard education on the test simulator
        run: xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES

      # Reuse the iPhone build; qualify all hosted tests and the three iPad regressions
      # without paying for another full UI suite or accepting a passing retry.
      - name: Run iPad tests without retries
        run: |
          if ! xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -configuration Debug \
            -destination "$DEST" \
            -jobs 2 \
            -only-testing:ClubhouseGoTests \
            -only-testing:ClubhouseGoUITests/FeedbackTriggersUITests/testClearQueuedFeedbackIsReachableFromEnrollmentSheetAndSettings \
            -only-testing:ClubhouseGoUITests/FeedbackTriggersUITests/testHeldReportsRequireConfirmationAndCanBeClearedWhileUnenrolled \
            -only-testing:ClubhouseGoUITests/CompanionAgentTreeUITests/testProjectUsesSameTreeAndCrossProjectCaption \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults/iPad.xcresult \
            2>&1 | tee xcodebuild-ipad.log; then
            echo "::warning::xcodebuild exited unsuccessfully; checking the complete xcresult"
          fi
          python3 scripts/verify-xcresult.py TestResults/iPad.xcresult "iPad hosted tests + UI smoke" \
            --no-retries-in ClubhouseGoTests --no-retries-in ClubhouseGoUITests

      - name: Upload iPad test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ipad
          path: |
            TestResults
            xcodebuild-ipad.log
          retention-days: 7

      - name: Delete iPad simulator
        if: ${{ always() && env.SIMULATOR_UDID != '' }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID"
          xcrun simctl delete "$SIMULATOR_UDID"

  # One check that is green when every lane this change needs passed (skipped lanes are fine).
  ci-result:
    name: CI result
    needs: [changes, swift-packages, build, release-build, ui-tests, ipad-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          bad = {job: n['result'] for job, n in json.load(sys.stdin).items() if n['result'] not in ('success', 'skipped')}
          print('Lanes:', 'all passed or not needed' if not bad else bad)
          sys.exit(1 if bad else 0)
          "
