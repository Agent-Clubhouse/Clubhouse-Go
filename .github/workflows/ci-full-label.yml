name: CI full on label

# Adding the `ci:full` label to a pull request dispatches a full CI run (every lane and UI class) on its branch.
# CI itself has no `labeled` trigger, so other labels never start or replace a CI run.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.label.name == 'ci:full' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a full CI run on the pull request's branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
