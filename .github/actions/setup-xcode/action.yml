name: Set up Xcode
description: >
  Select the Xcode whose iOS Simulator SDK matches the newest installed runtime (or the
  given Xcode, so test jobs match the build job), and optionally start booting an iPhone simulator.
inputs:
  xcode:
    description: Xcode.app path to use if installed; empty picks one that matches the simulator runtime.
    default: ''
  boot-simulator:
    description: Pick an iPhone simulator, export SIMULATOR_UDID and DEST, and start booting it in the background.
    default: 'false'
outputs:
  xcode:
    description: The selected Xcode.app path.
    value: ${{ steps.select.outputs.xcode }}
runs:
  using: composite
  steps:
    - name: Select Xcode
      id: select
      shell: bash
      env:
        REQUESTED_XCODE: ${{ inputs.xcode }}
      run: |
        if [ -n "$REQUESTED_XCODE" ] && [ -d "$REQUESTED_XCODE" ]; then
          BEST_XCODE="$REQUESTED_XCODE"
        else
          [ -n "$REQUESTED_XCODE" ] && echo "::warning::$REQUESTED_XCODE is not installed on this runner; matching the simulator runtime instead"
          # Find the installed iOS simulator runtime version
          SIM_VER=$(xcrun simctl list runtimes -j | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        for r in sorted(data['runtimes'], key=lambda x: x.get('version',''), reverse=True):
            if 'iOS' in r.get('name','') and r.get('isAvailable', False):
                print(r['version'])
                sys.exit(0)
        sys.exit(1)
        ")
          echo "Simulator runtime: iOS $SIM_VER"

          # Pick the Xcode whose SDK best matches the simulator runtime
          BEST_XCODE=""
          for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -rV); do
            SDK_VER=$("$xc/Contents/Developer/usr/bin/xcodebuild" -version -sdk iphonesimulator ProductVersion 2>/dev/null || true)
            echo "  $xc → SDK $SDK_VER"
            if [ "$SDK_VER" = "$SIM_VER" ]; then
              BEST_XCODE="$xc"
              break
            fi
          done

          # Fall back to latest if no exact match
          if [ -z "$BEST_XCODE" ]; then
            BEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "No exact SDK match — falling back to latest: $BEST_XCODE"
          fi
        fi

        echo "Selected Xcode: $BEST_XCODE"
        sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
        xcodebuild -version
        echo "xcode=$BEST_XCODE" >> "$GITHUB_OUTPUT"

    # Booting takes 1–2 minutes; start it now and wait with `xcrun simctl bootstatus` just before testing.
    - name: Start simulator
      if: inputs.boot-simulator == 'true'
      shell: bash
      run: |
        SIMULATOR_UDID=$(xcrun simctl list devices available -j | \
          python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        for runtime in sorted(data['devices'].keys(), reverse=True):
            if 'iOS' not in runtime:
                continue
            for d in sorted(data['devices'][runtime], key=lambda device: device['name']):
                if 'iPhone' in d['name']:
                    print(d['udid'])
                    sys.exit(0)
        sys.exit(1)
        ")
        echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
        echo "DEST=platform=iOS Simulator,id=$SIMULATOR_UDID" >> "$GITHUB_ENV"
        echo "Using simulator: $SIMULATOR_UDID"
        xcrun simctl boot "$SIMULATOR_UDID" || true  # already booted is fine
